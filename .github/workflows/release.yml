name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, exactly matching package.json (for example 0.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: >-
      github.repository == 'qiweiii/dsh-brand-studio' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'beta' || 'stable' }}
      RELEASE_NUMBER: ${{ github.run_number }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # No dependency installation or build in this privileged job.
      - name: Prepare and inspect the npm tarball
        run: node scripts/release.mjs prepare
      - name: Publish through npm trusted publishing
        run: node scripts/release.mjs publish
      - name: Create the GitHub release
        run: node scripts/release.mjs github
        env:
          GH_TOKEN: ${{ github.token }}
